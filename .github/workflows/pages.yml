name: Refresh and publish Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Collect real data (requires access and publication permission)
        type: boolean
        default: false
      days:
        description: Bounded publication lookback, 1 to 90 days (not historical market reconstruction)
        type: number
        default: 30
permissions:
  contents: read
concurrency:
  group: mlpops-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      digest: ${{ steps.evidence.outputs.digest }}
      dataset_digest: ${{ steps.evidence.outputs.dataset_digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install uv==0.12.3
      - run: uv sync --locked
      - name: Reconstruct durable data worktree
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data
            git worktree add --detach durable FETCH_HEAD
          else
            git worktree add --detach --no-checkout durable HEAD
            git -C durable switch --orphan data
          fi
      - name: Collect with credentials exclusively on trusted main
        id: collect
        if: (github.event_name == 'schedule' && vars.DATA_MODE == 'real') || inputs.refresh == true
        env:
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
          HH_USER_AGENT: ${{ vars.HH_USER_AGENT }}
          HH_PUBLICATION_PERMISSION: ${{ vars.HH_PUBLICATION_PERMISSION }}
          HH_REQUEST_BUDGET: ${{ vars.HH_REQUEST_BUDGET || '800' }}
          LOOKBACK: ${{ inputs.days || '30' }}
        run: uv run python -m collector collect --state durable/state --output durable/public/market.json --days "$LOOKBACK" --public
      - name: Persist validated state and failed run reports atomically
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          git -C durable add -A .
          if ! git -C durable diff --cached --quiet; then
            git -C durable -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "data: collection $GITHUB_RUN_ID"
            git -C durable push origin HEAD:refs/heads/data
          fi
      - name: Select explicit data mode without fallback
        env:
          DATA_MODE: ${{ vars.DATA_MODE || 'demo' }}
          PUBLICATION_PERMISSION: ${{ vars.HH_PUBLICATION_PERMISSION }}
        run: |
          if [ "$DATA_MODE" = real ]; then
            test -n "$PUBLICATION_PERMISSION"
            uv run python -m collector validate durable/public/market.json
            cp durable/public/market.json web/public/data/market.json
            rm web/public/data/demo.json
          elif [ "$DATA_MODE" = demo ]; then
            uv run python -m collector demo
          else
            exit 1
          fi
      - uses: actions/configure-pages@v6.0.0
        id: pages
      - run: npm ci
        working-directory: web
      - name: Build Pages with selected static export
        run: npm run check && npm test && npm run build
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_DATA_MODE: ${{ vars.DATA_MODE || 'demo' }}
      - name: Record production artifact digest
        id: evidence
        env:
          VITE_DATA_MODE: ${{ vars.DATA_MODE || 'demo' }}
        run: |
          python scripts/build_evidence.py
          echo "digest=$(sha256sum docs/verification/build-evidence.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if [ "$VITE_DATA_MODE" = real ]; then dataset=market; else dataset=demo; fi
          echo "dataset_digest=$(sha256sum "web/dist/data/$dataset.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat docs/verification/build-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
      - name: Check published index and selected export
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.dataset_digest }}
          DATA_MODE: ${{ vars.DATA_MODE || 'demo' }}
        run: |
          curl --location --fail --retry 5 --retry-delay 5 "$PAGE_URL" -o /tmp/mlpops-index.html
          if [ "$DATA_MODE" = real ]; then
            curl --location --fail --retry 5 "${PAGE_URL%/}/data/market.json" -o /tmp/mlpops-data.json
          else
            curl --location --fail --retry 5 "${PAGE_URL%/}/data/demo.json" -o /tmp/mlpops-data.json
          fi
          printf '%s  %s\n' "$EXPECTED_DIGEST" /tmp/mlpops-data.json | sha256sum --check
